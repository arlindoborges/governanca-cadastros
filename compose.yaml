services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-governanca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-governanca_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-governanca_cadastros}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-governanca} -d ${POSTGRES_DB:-governanca_cadastros}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
