[project]
name = "governanca-backend"
version = "0.1.0"
description = "Governança de Cadastros — API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "fastapi[standard]>=0.115.0",
  "openpyxl>=3.1.5",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governanca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
